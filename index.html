<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Your Script</title>

<script data-cfasync="false" src="//dcbbwymp1bhlf.cloudfront.net/?wbbcd=1253824"></script>
<script data-cfasync="false" src="//dcbbwymp1bhlf.cloudfront.net/?wbbcd=1253835"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.container {
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    padding: 60px 40px;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.1);
    max-width: 500px;
    width: 90%;
    animation: fadeIn 0.6s ease-out;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}
h1 { font-size: 32px; margin-bottom: 30px; font-weight: 600; letter-spacing: -0.5px; }
.timer-container { margin: 40px 0; }
#timer {
    font-size: 80px;
    font-weight: bold;
    background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}
.progress-bar {
    width: 100%; height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px; overflow: hidden; margin-top: 30px;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffffff 0%, #888888 100%);
    width: 100%;
    border-radius: 10px;
}
.progress-fill.animate {
    animation: progressAnimation 15s linear forwards;
}
@keyframes progressAnimation {
    from { width: 100%; }
    to { width: 0%; }
}
button {
    padding: 18px 45px; font-size: 20px;
    background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
    border: none; color: #000000; cursor: pointer;
    border-radius: 50px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease; display: none;
    margin-top: 20px; letter-spacing: 0.5px;
}
button:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 255, 255, 0.4); }
button:active { transform: translateY(-1px); }
button.show { display: inline-block; animation: bounceIn 0.6s ease-out; }
@keyframes bounceIn {
    0% { opacity: 0; transform: scale(0.3); }
    50% { transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
}
.subtitle { margin-top: 20px; font-size: 16px; opacity: 0.9; color: #cccccc; }
.particle { position: absolute; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; }

.modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    z-index: 100;
    justify-content: center;
    align-items: center;
}
.modal-overlay.show { display: flex; animation: fadeIn 0.3s ease-out; }
.modal-box {
    background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 44px 36px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes slideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-logo {
    font-size: 48px; margin-bottom: 16px; display: block;
    animation: catBounce 2s ease-in-out infinite;
}
@keyframes catBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
.modal-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #fff; letter-spacing: -0.5px; }
.modal-sub { font-size: 14px; color: rgba(255,255,255,0.55); margin-bottom: 32px; line-height: 1.6; }
.modal-buttons { display: flex; gap: 12px; justify-content: center; }
.btn-ok {
    padding: 14px 36px;
    background: linear-gradient(135deg, #ffffff, #d0d0d0);
    color: #000; border: none; border-radius: 50px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    display: inline-block !important; margin: 0;
    box-shadow: 0 8px 24px rgba(255,255,255,0.15);
    transition: all 0.25s ease;
}
.btn-ok:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,255,255,0.3); }
.btn-nuh {
    padding: 14px 36px; background: transparent;
    color: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50px; font-size: 16px; font-weight: 600;
    cursor: pointer; display: inline-block !important; margin: 0;
    box-shadow: none; transition: all 0.25s ease;
}
.btn-nuh:hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }

#keyStage { display: none; }
.key-box {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 18px 24px;
    font-family: 'Courier New', monospace;
    font-size: 22px; font-weight: 700;
    letter-spacing: 3px; color: #fff;
    margin: 20px 0 10px; word-break: break-all;
}
.key-tag {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 4px 12px; border-radius: 20px; margin-bottom: 8px;
}
@media (max-width: 600px) {
    .container { padding: 40px 30px; }
    h1 { font-size: 24px; }
    #timer { font-size: 60px; }
    button { padding: 15px 35px; font-size: 18px; }
    .modal-box { padding: 36px 24px; }
    .modal-buttons { flex-direction: column; }
    .btn-ok, .btn-nuh { width: 100%; }
}
</style>
</head>
<body>

<a href="home.html" style="
    position: fixed; top: 20px; right: 20px; z-index: 999;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #f0f0f0;
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px; font-weight: 600;
    text-decoration: none; border-radius: 8px;
    backdrop-filter: blur(10px);
    transition: all 0.2s ease;
" onmouseover="this.style.background='rgba(255,255,255,0.12)'" onmouseout="this.style.background='rgba(255,255,255,0.06)'">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Home
</a>

<div class="container" id="mainContainer">
    <h1 id="mainTitle">⏳ Please Wait...</h1>
    <div class="timer-container">
        <p id="timer">15</p>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <p class="subtitle" id="subtitle">Your script is being prepared</p>
    <button id="btn" onclick="onMainBtnClick()" id="btn">Get Script Now</button>

    <div id="keyStage">
        <div class="key-tag" id="keyTag">FREE KEY</div>
        <div class="key-box" id="keyValue">FREE</div>
        <button id="copyKeyBtn" class="show" onclick="copyKey()" style="margin-top:10px;">
            📋 Copy Key
        </button>
        <p class="subtitle" id="keyCopiedMsg" style="display:none; color:#fff; margin-top:12px;">✓ Key copied!</p>
    </div>
</div>

<div class="modal-overlay" id="avocatModal">
    <div class="modal-box">
        <span class="modal-logo">🐱</span>
        <div class="modal-title">AvoCat Hub has a key!</div>
        <div class="modal-sub">Do you want to get it?<br>It's completely <strong>FREE</strong> 🎉</div>
        <div class="modal-buttons">
            <button class="btn-ok" onclick="startKeyFlow()">Ok</button>
            <button class="btn-nuh" onclick="closeModal()">Nuh</button>
        </div>
    </div>
</div>

<script>
function createParticles() {
    for (let i = 0; i < 60; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 6 + 3;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = '100%';
        const duration = Math.random() * 8 + 6;
        const delay = Math.random() * 10;
        const drift = Math.random() * 200 - 100;
        particle.style.animation = `float-${i} ${duration}s linear ${delay}s infinite`;
        const keyframes = `
            @keyframes float-${i} {
                0%   { transform: translateY(0) translateX(0); opacity: 0; }
                10%  { opacity: 0.8; }
                90%  { opacity: 0.8; }
                100% { transform: translateY(-120vh) translateX(${drift}px); opacity: 0; }
            }`;
        const style = document.createElement('style');
        style.textContent = keyframes;
        document.head.appendChild(style);
        document.body.appendChild(particle);
    }
}
createParticles();

const urlParams = new URLSearchParams(window.location.search);
const scriptId  = urlParams.get('id');
const isAvoCat  = scriptId === 'script_avocat';
const isGetKey  = scriptId === 'get_key';

let timerEl  = document.getElementById('timer');
let btn      = document.getElementById('btn');
let subtitle = document.getElementById('subtitle');
let fill     = document.getElementById('progressFill');
let currentInterval = null;

function startTimer(seconds, onTick, onDone) {
    if (currentInterval) { clearInterval(currentInterval); currentInterval = null; }
    let t = seconds;
    timerEl.innerText = t;
    currentInterval = setInterval(() => {
        t--;
        timerEl.innerText = t;
        if (onTick) onTick(t);
        if (t <= 0) {
            clearInterval(currentInterval);
            currentInterval = null;
            timerEl.innerText = '✓';
            if (onDone) onDone();
        }
    }, 1000);
}

fill.classList.add('animate');
subtitle.innerText = isGetKey ? 'Your key is being prepared' : 'Your script is being prepared';
if (isGetKey) {
    document.getElementById('btn').innerText = 'Get Key Now';
}
startTimer(15, null, () => {
    btn.classList.add('show');
    subtitle.innerText = isGetKey ? 'Your key is ready!' : 'Ready to download!';
});

function onMainBtnClick() {
    if (isGetKey) {
        showMyKey();
    } else if (scriptId) {
        sessionStorage.setItem('ad_passed_' + scriptId, 'true');
        window.location.href = `script.html?id=${scriptId}`;
    } else {
        alert('Error: No script ID provided');
    }
}

// ── AvoCat modal ──
const showModal = urlParams.get('showModal');
if (isAvoCat && showModal === '1') {
    document.getElementById('mainContainer').style.display = 'none';
    document.getElementById('avocatModal').classList.add('show');
}

function closeModal() {
    document.getElementById('avocatModal').classList.remove('show');
}

function startKeyFlow() {
    document.getElementById('avocatModal').classList.remove('show');
    document.getElementById('mainTitle').innerText = '⏳ Please Wait...';
    subtitle.innerText = 'Preparing your key...';
    btn.classList.remove('show');
    document.getElementById('keyStage').style.display = 'none';
    document.getElementById('mainContainer').style.display = '';
    fill.classList.remove('animate');
    void fill.offsetWidth;
    fill.classList.add('animate');
    startTimer(15, null, () => {
        subtitle.innerText = 'Your key is ready!';
        showAvoCatKey();
    });
}

// ── AvoCat key (FREE) ──
function showAvoCatKey() {
    btn.classList.remove('show');
    document.getElementById('mainTitle').innerText = '🐱 AvoCat Key';
    document.getElementById('keyTag').innerText = 'FREE KEY';
    document.getElementById('keyValue').innerText = 'FREE';
    document.getElementById('keyStage').style.display = 'block';
}

// ── Твій динамічний ключ ──
async function showMyKey() {
    btn.classList.remove('show');
    document.getElementById('mainTitle').innerText = '🔑 Your Key';
    document.getElementById('keyTag').innerText = 'YOUR KEY';
    document.getElementById('keyValue').innerText = '⏳ Loading...';
    document.getElementById('keyStage').style.display = 'block';

    try {
        const res = await fetch('https://private-production-7bcd.up.railway.app/addkey');
        const data = await res.json();
        document.getElementById('keyValue').innerText = data.key;
    } catch (e) {
        document.getElementById('keyValue').innerText = 'Error, try again';
    }
}

function copyKey() {
    const key = document.getElementById('keyValue').innerText;
    navigator.clipboard.writeText(key).then(() => {
        const msg = document.getElementById('keyCopiedMsg');
        const copyBtn = document.getElementById('copyKeyBtn');
        copyBtn.innerText = '✓ Copied!';
        msg.style.display = 'block';
        setTimeout(() => {
            copyBtn.innerText = '📋 Copy Key';
            msg.style.display = 'none';
        }, 2500);
    });
}
</script>

<script src="adblock.js?v=2"></script>
</body>
</html>
