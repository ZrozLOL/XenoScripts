<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XenoScripts — Scripts Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.18);
  --text: #f0f0f0;
  --muted: rgba(255,255,255,0.45);
  --accent: #ffffff;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #facc15;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* noise */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:0;
}
/* grid */
body::after {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events:none; z-index:0;
}

/* ── NAV ─────────────────────────────────────────────────────────── */
nav {
  position:fixed; top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:space-between;
  padding: 22px 40px;
  background: rgba(8,8,8,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}

.logo {
  font-family: 'Space Mono', monospace;
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
}
.logo span { opacity:0.35; }

.nav-right { display:flex; gap:12px; align-items:center; }

.nav-btn {
  display:inline-flex; align-items:center; gap:8px;
  padding: 10px 22px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  cursor:pointer;
  border-radius: 8px;
  text-decoration:none;
  transition: all 0.2s ease;
  letter-spacing: 0.5px;
}
.nav-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.2);
  transform: translateY(-1px);
}

/* ── HERO BAR ────────────────────────────────────────────────────── */
.hub-hero {
  position: relative; z-index:1;
  padding: 130px 40px 50px;
  max-width: 1200px;
  margin: 0 auto;
}

.hub-hero h1 {
  font-size: clamp(36px, 6vw, 72px);
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1;
  margin-bottom: 14px;
}
.hub-hero h1 em {
  font-style: normal;
  -webkit-text-stroke: 1.5px rgba(255,255,255,0.4);
  color: transparent;
}
.hub-hero p {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 0;
}

/* ── TOOLBAR ─────────────────────────────────────────────────────── */
.toolbar {
  position: relative; z-index:1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 40px 30px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.search-wrap {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-wrap svg {
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  opacity:0.4; pointer-events:none;
}
#searchInput {
  width:100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px 12px 40px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
#searchInput:focus { border-color: rgba(255,255,255,0.25); }
#searchInput::placeholder { color: var(--muted); }

.filter-group { display:flex; gap:8px; flex-wrap:wrap; }

.filter-btn {
  padding: 10px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.filter-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.filter-btn.active {
  background: #fff;
  color: #000;
  border-color: #fff;
}

.sort-select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
.sort-select:hover { border-color: rgba(255,255,255,0.2); }
option { background: #111; }

/* ── GRID ────────────────────────────────────────────────────────── */
.hub-main {
  position: relative; z-index:1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 40px 80px;
}

.scripts-count {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 20px;
  letter-spacing: 1px;
}

#scriptsGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

/* ── CARD ────────────────────────────────────────────────────────── */
.script-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  transition: all 0.25s ease;
  cursor: pointer;
  animation: cardIn 0.4s ease both;
  display: flex;
  flex-direction: column;
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
.script-card:hover {
  border-color: var(--border-hover);
  background: var(--surface-hover);
  transform: translateY(-4px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
}

/* thumbnail */
.card-thumb {
  width:100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: rgba(255,255,255,0.04);
}
.card-thumb-placeholder {
  width:100%;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
}

.card-body {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.card-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.badge {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  font-weight: 700;
  border: 1px solid;
}
.badge-keyless {
  color: var(--green);
  border-color: rgba(74,222,128,0.3);
  background: rgba(74,222,128,0.08);
}
.badge-key {
  color: var(--yellow);
  border-color: rgba(250,204,21,0.3);
  background: rgba(250,204,21,0.08);
}
.badge-key-hard {
  color: var(--red);
  border-color: rgba(248,113,113,0.3);
  background: rgba(248,113,113,0.08);
}
.badge-new {
  color: #a78bfa;
  border-color: rgba(167,139,250,0.3);
  background: rgba(167,139,250,0.08);
}
.badge-side {
  color: var(--muted);
  border-color: rgba(255,255,255,0.1);
  background: transparent;
}

.card-name {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.3px;
  color: var(--text);
}

.card-game {
  font-size: 12px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* stats row */
.card-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.stat-item svg { flex-shrink:0; }

/* like/dislike buttons */
.like-btn, .dislike-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.2s;
}
.like-btn:hover { color: var(--green); background: rgba(74,222,128,0.08); }
.dislike-btn:hover { color: var(--red); background: rgba(248,113,113,0.08); }
.like-btn.active { color: var(--green); }
.dislike-btn.active { color: var(--red); }

.date-tag {
  margin-left: auto;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.2);
}

/* ── EMPTY STATE ─────────────────────────────────────────────────── */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}
.empty-state h3 {
  font-size: 22px;
  margin-bottom: 10px;
  font-weight: 800;
}
.empty-state p { font-size: 14px; }

/* ── LOADING ─────────────────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg,
    rgba(255,255,255,0.04) 25%,
    rgba(255,255,255,0.08) 50%,
    rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 8px;
}
@keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

.skeleton-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
}
.skeleton-thumb { width:100%; aspect-ratio:16/9; }
.skeleton-body { padding:18px 20px; display:flex; flex-direction:column; gap:10px; }
.skeleton-line { height:12px; border-radius:4px; }

/* ── MODAL ───────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset:0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.25s;
}
.modal-overlay.open {
  opacity:1;
  pointer-events:all;
}

.modal {
  background: #0f0f0f;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  max-width: 520px;
  width:100%;
  max-height: 90vh;
  overflow-y: auto;
  transform: scale(0.95) translateY(20px);
  transition: transform 0.25s ease;
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); }

.modal-thumb {
  width:100%;
  aspect-ratio: 16/9;
  object-fit:cover;
  border-radius: 24px 24px 0 0;
}
.modal-thumb-placeholder {
  width:100%;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border-radius: 24px 24px 0 0;
  display:flex; align-items:center; justify-content:center;
  font-size:56px;
}

.modal-body { padding: 28px; }
.modal-badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.modal-name { font-size:24px; font-weight:800; letter-spacing:-0.5px; margin-bottom:6px; }
.modal-game { font-family:'Space Mono', monospace; font-size:13px; color:var(--muted); margin-bottom:20px; }
.modal-features { margin-bottom:20px; }
.modal-features-label {
  font-family:'Space Mono', monospace; font-size:10px; letter-spacing:2px;
  text-transform:uppercase; color:var(--muted); margin-bottom:10px;
}
.modal-features-list { display:flex; gap:6px; flex-wrap:wrap; }
.feature-tag {
  font-family:'Space Mono', monospace; font-size:11px;
  padding:5px 12px; border-radius:6px;
  background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--muted);
}

.modal-stats {
  display:flex; gap:20px; margin-bottom:24px;
  padding-bottom:24px;
  border-bottom:1px solid var(--border);
}
.modal-stat { text-align:center; }
.modal-stat-num { font-family:'Space Mono', monospace; font-size:22px; font-weight:700; display:block; }
.modal-stat-label { font-size:11px; color:var(--muted); margin-top:2px; }

.modal-actions { display:flex; gap:10px; flex-wrap:wrap; }

.btn-get {
  flex:1; min-width:160px;
  padding:14px 24px;
  background:#fff; color:#000;
  font-family:'Space Mono', monospace; font-size:13px; font-weight:700;
  border:none; border-radius:10px; cursor:pointer;
  text-decoration:none; text-align:center;
  transition: all 0.2s;
}
.btn-get:hover { background:#ddd; transform:translateY(-1px); }

.btn-modal-like, .btn-modal-dislike {
  padding:14px 18px;
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); font-family:'Space Mono', monospace; font-size:12px;
  border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:6px;
  transition: all 0.2s;
}
.btn-modal-like:hover { color:var(--green); border-color:rgba(74,222,128,0.3); background:rgba(74,222,128,0.07); }
.btn-modal-dislike:hover { color:var(--red); border-color:rgba(248,113,113,0.3); background:rgba(248,113,113,0.07); }
.btn-modal-like.active { color:var(--green); }
.btn-modal-dislike.active { color:var(--red); }

.modal-close {
  float:right; width:36px; height:36px;
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); border-radius:8px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; font-size:18px;
  margin-bottom:16px;
}
.modal-close:hover { color:#fff; border-color:rgba(255,255,255,0.2); }

/* ── FOOTER ──────────────────────────────────────────────────────── */
footer {
  position:relative; z-index:1;
  border-top:1px solid var(--border);
  padding:36px 40px;
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:20px;
}
.footer-logo { font-family:'Space Mono', monospace; font-size:14px; color:var(--muted); }
.footer-links { display:flex; gap:24px; font-family:'Space Mono', monospace; font-size:12px; }
.footer-links a { color:var(--muted); text-decoration:none; transition:color 0.2s; }
.footer-links a:hover { color:#fff; }

/* ── SCROLL ──────────────────────────────────────────────────────── */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.2); }

/* ── RESPONSIVE ──────────────────────────────────────────────────── */
@media(max-width:700px) {
  nav { padding:18px 20px; }
  .hub-hero { padding:110px 20px 36px; }
  .toolbar { padding:0 20px 24px; }
  .hub-main { padding:0 20px 60px; }
  #scriptsGrid { grid-template-columns:1fr; }
  footer { padding:24px 20px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Xeno<span>/</span>Scripts</a>
  <div class="nav-right">
    <a href="https://t.me/XenoScriptsSupported" target="_blank" class="nav-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
      </svg>
      Telegram
    </a>
  </div>
</nav>

<div class="hub-hero">
  <h1>Scripts <em>Hub</em></h1>
  <p>All scripts from the channel — updated in real time.</p>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search by name or game...">
  </div>

  <div class="filter-group">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="keyless">🔑🚫 Keyless</button>

  </div>

  <select class="sort-select" id="sortSelect">
    <option value="newest">Newest First</option>
    <option value="trending">Trending (Views)</option>
    <option value="liked">Most Liked</option>
    <option value="oldest">Oldest First</option>
  </select>
</div>

<main class="hub-main">
  <div class="scripts-count" id="scriptsCount">Loading...</div>
  <div id="scriptsGrid">
    <!-- skeleton placeholders -->
    <div class="skeleton-card" id="skel1">
      <div class="skeleton skeleton-thumb"></div>
      <div class="skeleton-body">
        <div class="skeleton skeleton-line" style="width:60%"></div>
        <div class="skeleton skeleton-line" style="width:40%"></div>
        <div class="skeleton skeleton-line" style="width:80%"></div>
      </div>
    </div>
    <div class="skeleton-card" id="skel2">
      <div class="skeleton skeleton-thumb"></div>
      <div class="skeleton-body">
        <div class="skeleton skeleton-line" style="width:70%"></div>
        <div class="skeleton skeleton-line" style="width:35%"></div>
        <div class="skeleton skeleton-line" style="width:60%"></div>
      </div>
    </div>
    <div class="skeleton-card" id="skel3">
      <div class="skeleton skeleton-thumb"></div>
      <div class="skeleton-body">
        <div class="skeleton skeleton-line" style="width:50%"></div>
        <div class="skeleton skeleton-line" style="width:45%"></div>
        <div class="skeleton skeleton-line" style="width:75%"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-logo">XenoScripts © 2026</div>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="https://t.me/XenoScriptsSupported" target="_blank">Telegram</a>
  </div>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────
const GITHUB_RAW = 'https://raw.githubusercontent.com/ZrozLOL/XenoScripts/main/scripts.json';
const BOT_USERNAME = 'XenoScriptsBot'; // replace with your real bot username
const CHANNEL_LINK = 'https://t.me/XenoScriptsSupported';
const STORAGE_KEY = 'xeno_hub_data';

// ── STORAGE HELPERS ───────────────────────────────────────────────────
function getStorage() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveStorage(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

function getViews(id) { return (getStorage()[id]?.views || 0); }
function getLikes(id) { return (getStorage()[id]?.likes || 0); }
function getDislikes(id) { return (getStorage()[id]?.dislikes || 0); }
function getUserVote(id) { return (getStorage()[id]?.vote || null); }

function incrementView(id) {
  const s = getStorage();
  if (!s[id]) s[id] = {};
  if (!s[id].viewed) { // count unique view per session using sessionStorage
    try {
      const sess = JSON.parse(sessionStorage.getItem('xeno_viewed') || '[]');
      if (!sess.includes(id)) {
        sess.push(id);
        sessionStorage.setItem('xeno_viewed', JSON.stringify(sess));
        s[id].views = (s[id].views || 0) + 1;
        saveStorage(s);
      }
    } catch { s[id].views = (s[id].views || 0) + 1; saveStorage(s); }
  }
}

function setVote(id, vote) {
  const s = getStorage();
  if (!s[id]) s[id] = {};
  const prev = s[id].vote || null;
  if (prev === vote) return null; // toggle off
  if (prev === 'like') s[id].likes = Math.max(0, (s[id].likes || 0) - 1);
  if (prev === 'dislike') s[id].dislikes = Math.max(0, (s[id].dislikes || 0) - 1);
  s[id].vote = vote;
  if (vote === 'like') s[id].likes = (s[id].likes || 0) + 1;
  if (vote === 'dislike') s[id].dislikes = (s[id].dislikes || 0) + 1;
  saveStorage(s);
  return vote;
}

// ── STATE ─────────────────────────────────────────────────────────────
let allScripts = [];
let activeFilter = 'all';
let activeSort = 'newest';
let searchQuery = '';

// ── FETCH ─────────────────────────────────────────────────────────────
async function fetchScripts() {
  try {
    const resp = await fetch(GITHUB_RAW + '?t=' + Date.now());
    const data = await resp.json();
    allScripts = Object.entries(data.scripts || {}).map(([id, s]) => ({ id, ...s }));
    render();
  } catch(e) {
    document.getElementById('scriptsGrid').innerHTML =
      `<div class="empty-state"><h3>Could not load scripts</h3><p>Check your connection and try again.</p></div>`;
    document.getElementById('scriptsCount').textContent = 'Error loading scripts';
  }
}

// ── FILTER + SORT ─────────────────────────────────────────────────────
function getFiltered() {
  let list = [...allScripts];

  if (activeFilter === 'keyless') list = list.filter(s => s.keyless);
  if (activeFilter === 'keyed') list = list.filter(s => !s.keyless);

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(s =>
      (s.name || '').toLowerCase().includes(q) ||
      (s.game || '').toLowerCase().includes(q)
    );
  }

  if (activeSort === 'newest') {
    list.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
  } else if (activeSort === 'oldest') {
    list.sort((a,b) => new Date(a.date||0) - new Date(b.date||0));
  } else if (activeSort === 'trending') {
    list.sort((a,b) => getViews(b.id) - getViews(a.id));
  } else if (activeSort === 'liked') {
    list.sort((a,b) => getLikes(b.id) - getLikes(a.id));
  }

  return list;
}

// ── KEY BADGE ─────────────────────────────────────────────────────────
function keyBadge(script) {
  if (script.keyless) return `<span class="badge badge-keyless">KEYLESS</span>`;
  if (script.key_difficulty === 'hard') return `<span class="badge badge-key-hard">HARD KEY</span>`;
  if (script.key_difficulty === 'medium') return `<span class="badge badge-key">MEDIUM KEY</span>`;
  return `<span class="badge badge-key">HAS KEY</span>`;
}

function sideBadge(script) {
  const map = { server:'🖥️ Server', client:'💻 Client', both:'🖥️💻 Both' };
  const label = map[script.script_side] || '💻 Client';
  return `<span class="badge badge-side">${label}</span>`;
}

function isNew(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  return (now - d) < 1000*60*60*24*7; // 7 days
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' });
}

// ── RENDER GRID ───────────────────────────────────────────────────────
function render() {
  const list = getFiltered();
  const grid = document.getElementById('scriptsGrid');
  const countEl = document.getElementById('scriptsCount');

  countEl.textContent = `${list.length} script${list.length !== 1 ? 's' : ''} found`;

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <h3>No scripts found</h3>
      <p>Try a different filter or search query.</p>
    </div>`;
    return;
  }

  grid.innerHTML = '';
  list.forEach((script, i) => {
    const card = document.createElement('div');
    card.className = 'script-card';
    card.style.animationDelay = `${Math.min(i * 40, 400)}ms`;

    const views = getViews(script.id);
    const likes = getLikes(script.id);
    const dislikes = getDislikes(script.id);
    const vote = getUserVote(script.id);
    const newBadge = isNew(script.date) ? `<span class="badge badge-new">NEW</span>` : '';
    const gameName = script.game === 'Universal' ? '🌐 Universal' : `🎮 ${script.game}`;

    const thumbHtml = script.thumbnail_url
      ? `<img class="card-thumb" src="${script.thumbnail_url}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'card-thumb-placeholder\\'>🎮</div>'">`
      : `<div class="card-thumb-placeholder">🎮</div>`;

    card.innerHTML = `
      ${thumbHtml}
      <div class="card-body">
        <div class="card-badges">
          ${newBadge}
          ${keyBadge(script)}
          ${sideBadge(script)}
        </div>
        <div class="card-name">${escHtml(script.name || 'Unknown Script')}</div>
        <div class="card-game">${escHtml(gameName)}</div>
        <div class="card-stats">
          <div class="stat-item">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <span>${formatNum(views)}</span>
          </div>
          <button class="like-btn ${vote==='like'?'active':''}" data-id="${script.id}" data-action="like">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="${vote==='like'?'currentColor':'none'}" stroke="currentColor" stroke-width="2">
              <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
              <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
            </svg>
            <span>${formatNum(likes)}</span>
          </button>
          <button class="dislike-btn ${vote==='dislike'?'active':''}" data-id="${script.id}" data-action="dislike">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="${vote==='dislike'?'currentColor':'none'}" stroke="currentColor" stroke-width="2">
              <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/>
              <path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
            </svg>
            <span>${formatNum(dislikes)}</span>
          </button>
          <span class="date-tag">${formatDate(script.date)}</span>
        </div>
      </div>
    `;

    // vote buttons (stop propagation so card click doesn't fire)
    card.querySelectorAll('.like-btn, .dislike-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        handleVote(script.id, btn.dataset.action, card);
      });
    });

    card.addEventListener('click', () => openModal(script));
    grid.appendChild(card);
  });
}

// ── VOTE ──────────────────────────────────────────────────────────────
function handleVote(id, action, cardEl) {
  const newVote = setVote(id, action);
  // re-render just this card's stat row
  const likeBtn = cardEl.querySelector('.like-btn');
  const dislikeBtn = cardEl.querySelector('.dislike-btn');
  const likes = getLikes(id);
  const dislikes = getDislikes(id);
  const vote = getUserVote(id);

  likeBtn.className = `like-btn ${vote==='like'?'active':''}`;
  likeBtn.querySelector('svg').setAttribute('fill', vote==='like'?'currentColor':'none');
  likeBtn.querySelector('span').textContent = formatNum(likes);

  dislikeBtn.className = `dislike-btn ${vote==='dislike'?'active':''}`;
  dislikeBtn.querySelector('svg').setAttribute('fill', vote==='dislike'?'currentColor':'none');
  dislikeBtn.querySelector('span').textContent = formatNum(dislikes);
}

// ── MODAL ─────────────────────────────────────────────────────────────
function openModal(script) {
  incrementView(script.id);

  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');

  const views = getViews(script.id);
  const likes = getLikes(script.id);
  const dislikes = getDislikes(script.id);
  const vote = getUserVote(script.id);
  const gameName = script.game === 'Universal' ? '🌐 Universal' : `🎮 ${script.game}`;
  const features = (script.features || []).filter(Boolean);
  const newBadge = isNew(script.date) ? `<span class="badge badge-new">NEW</span>` : '';

  const thumbHtml = script.thumbnail_url
    ? `<img class="modal-thumb" src="${script.thumbnail_url}" alt="" onerror="this.parentNode.innerHTML='<div class=\\'modal-thumb-placeholder\\'>🎮</div>'">`
    : `<div class="modal-thumb-placeholder">🎮</div>`;

  const featureHtml = features.length
    ? `<div class="modal-features">
        <div class="modal-features-label">// Features</div>
        <div class="modal-features-list">
          ${features.map(f => `<span class="feature-tag">${escHtml(f)}</span>`).join('')}
        </div>
      </div>`
    : '';

  body.innerHTML = `
    ${thumbHtml}
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-badges">
      ${newBadge}
      ${keyBadge(script)}
      ${sideBadge(script)}
    </div>
    <div class="modal-name">${escHtml(script.name || 'Unknown Script')}</div>
    <div class="modal-game">${escHtml(gameName)}</div>
    ${featureHtml}
    <div class="modal-stats">
      <div class="modal-stat">
        <span class="modal-stat-num" id="m-views">${formatNum(views)}</span>
        <div class="modal-stat-label">Views</div>
      </div>
      <div class="modal-stat">
        <span class="modal-stat-num" id="m-likes">${formatNum(likes)}</span>
        <div class="modal-stat-label">Likes</div>
      </div>
      <div class="modal-stat">
        <span class="modal-stat-num" id="m-dislikes">${formatNum(dislikes)}</span>
        <div class="modal-stat-label">Dislikes</div>
      </div>
      <div class="modal-stat">
        <span class="modal-stat-num">${script.date || '—'}</span>
        <div class="modal-stat-label">Added</div>
      </div>
    </div>
    <div class="modal-actions">
      <a href="https://t.me/${BOT_USERNAME}?start=${script.id}" target="_blank" class="btn-get">
        📜 Get Script →
      </a>
      <button class="btn-modal-like ${vote==='like'?'active':''}" id="m-like-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="${vote==='like'?'currentColor':'none'}" stroke="currentColor" stroke-width="2">
          <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
          <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
        </svg>
        <span id="m-like-count">${formatNum(likes)}</span>
      </button>
      <button class="btn-modal-dislike ${vote==='dislike'?'active':''}" id="m-dislike-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="${vote==='dislike'?'currentColor':'none'}" stroke="currentColor" stroke-width="2">
          <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/>
          <path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
        </svg>
        <span id="m-dislike-count">${formatNum(dislikes)}</span>
      </button>
    </div>
  `;

  // modal vote handlers
  document.getElementById('m-like-btn').addEventListener('click', () => modalVote(script.id, 'like'));
  document.getElementById('m-dislike-btn').addEventListener('click', () => modalVote(script.id, 'dislike'));
  document.getElementById('modalClose').addEventListener('click', closeModal);

  overlay.classList.add('open');

  // update view counter in grid
  render();
}

function modalVote(id, action) {
  setVote(id, action);
  const vote = getUserVote(id);
  const likes = getLikes(id);
  const dislikes = getDislikes(id);

  const likeBtn = document.getElementById('m-like-btn');
  const dislikeBtn = document.getElementById('m-dislike-btn');

  likeBtn.className = `btn-modal-like ${vote==='like'?'active':''}`;
  likeBtn.querySelector('svg').setAttribute('fill', vote==='like'?'currentColor':'none');
  document.getElementById('m-like-count').textContent = formatNum(likes);
  document.getElementById('m-likes').textContent = formatNum(likes);

  dislikeBtn.className = `btn-modal-dislike ${vote==='dislike'?'active':''}`;
  dislikeBtn.querySelector('svg').setAttribute('fill', vote==='dislike'?'currentColor':'none');
  document.getElementById('m-dislike-count').textContent = formatNum(dislikes);
  document.getElementById('m-dislikes').textContent = formatNum(dislikes);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ── UTILS ─────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatNum(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return String(n);
}

// ── EVENTS ────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById('sortSelect').addEventListener('change', e => {
  activeSort = e.target.value;
  render();
});

let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    render();
  }, 250);
});

// keyboard shortcut: Escape to close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── INIT ──────────────────────────────────────────────────────────────
fetchScripts();
</script>
</body>
</html>
